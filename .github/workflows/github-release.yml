name: GitHub Release

# Releases are initiated deliberately, from the validated main branch only.
# This workflow builds and tests the selected main commit before creating
# an immutable version tag and uploading the compiled package to GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, pack and release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # GitHub Release and its tag; no npm credentials.
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          experimental: true

      - name: Validate version and availability
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver for release: $version" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; bump package.json instead." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # Never let a stale or accidentally downgraded version move latest backwards.
            existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
            VERSION="$version" EXISTING="$existing" node - <<'NODE'
          const current = process.env.VERSION.split(".").map(Number);
          const newer = (old) => current.some((value, i) =>
            value > old[i] && current.slice(0, i).every((v, j) => v === old[j]));
          for (const tag of (process.env.EXISTING || "").split("\n")) {
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) continue;
            if (!newer(tag.slice(1).split(".").map(Number))) {
              console.error("Stable version must exceed existing release " + tag);
              process.exit(1);
            }
          }
          NODE
          fi

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run full quality and security checks
        run: pnpm cicheck

      - name: Build
        run: pnpm build

      - name: Pack and verify
        id: pack
        run: |
          set -euo pipefail
          pnpm pack
          archive="$(find . -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -Fx 'package/dist/index.js'
          tar -tzf "$archive" | grep -Fx 'package/dist/index.cjs'
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease --latest=false)
          else
            options+=(--latest)
          fi
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${options[@]}"

      - name: Point moving latest tag at the published stable release
        if: steps.version.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The published immutable version tag is authoritative.
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$release_sha" = "$GITHUB_SHA"
          # "latest" is intentionally movable; do not give it a GitHub Release.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$release_sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/latest" -f sha="$release_sha" >/dev/null
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')"
          test "$actual" = "$release_sha"
          echo "latest -> $TAG ($release_sha)"
